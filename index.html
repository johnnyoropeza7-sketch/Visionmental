<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Descubre">
<title>Descubre</title>
<style>
:root{--bg:#f5f5f7;--fg:#1d1d1f;--card:#fff;--mut:#6e6e73;--ac:#7b3fe4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0818;--fg:#f2f2f4;--card:#1b1228;--mut:#a49bb5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0818;--fg:#f2f2f4;--card:#1b1228;--mut:#a49bb5;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{height:100%;display:flex;flex-direction:column;padding:6px 10px}
header{display:flex;align-items:center;gap:10px;padding:2px 2px 8px}
header img{width:36px;height:36px;border-radius:9px}
#tt{flex:1;line-height:1.1}#tt b{font-size:16px;display:block}#tt small{font-size:11px;color:var(--mut)}
#pg{font-size:12px;color:var(--mut)}
button{font:inherit;border:0;border-radius:10px;padding:8px 14px;background:var(--ac);color:#fff;font-weight:600}
button.g{background:var(--card);color:var(--fg);border:1px solid var(--mut)}
#grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:8px;touch-action:pan-y}
.c{background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.c img{flex:1;min-height:0;width:100%;object-fit:cover;pointer-events:none;display:block}
.c span{font-size:13px;font-weight:600;text-align:center;padding:4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#det{flex:1;min-height:0;display:none;flex-direction:column;gap:8px;overflow:auto;-webkit-user-select:auto;user-select:auto}
#det img{width:100%;max-height:42%;object-fit:cover;border-radius:14px;flex-shrink:0}
#det h2{margin:0;font-size:22px}
#det p{margin:0;font-size:15px;line-height:1.45}
#det small{color:var(--mut)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center;z-index:70}
#set{position:fixed;inset:0;background:var(--bg);overflow:auto;display:none;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px));box-sizing:border-box;-webkit-user-select:auto;user-select:auto;z-index:20}
#set h2{margin:0 0 10px;font-size:20px}
.row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.card{background:var(--card);border-radius:12px;padding:10px;margin:10px 0}
select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--mut);background:var(--bg);color:var(--fg)}
small{color:var(--mut)}
</style></head>
<body>
<div id="app">
<header><img id="lg" alt=""><div id="tt"><b>Descubre</b><small>por el Mago Camilo</small></div><span id="pg"></span><button id="close">Cerrar</button></header>
<div id="grid"></div>
<div id="det"><img id="di" alt=""><h2 id="dn"></h2><p id="dt"></p><small>Fuente: Wikipedia</small><button id="back">Volver</button></div>
</div>
<div id="toast"></div>
<div id="set">
<h2>Configuración</h2>
<div class="card">
<div class="row"><label><input type="checkbox" id="vz" checked> Voz activada (nombre de lo que abren)</label></div>
<div class="row"><select id="lang"><option value="es-ES">Español (España)</option><option value="es-MX">Español (México)</option><option value="es-US">Español (EE. UU.)</option></select><button class="g" id="test">Probar audio</button></div>
<small>La voz sale por el audio activo del iPhone. Conecta tu audífono Bluetooth en Ajustes del iPhone.</small>
</div>
<div class="card"><b>Usar sin internet</b><div class="row"><button id="dl">Descargar todo</button></div><small id="dls">Con internet, descarga las fotos y textos una sola vez. Después funciona sin conexión.</small></div>
<div class="row"><button id="sc">Listo</button></div>
</div>
<script>
const N=100,$=id=>document.getElementById(id);
const MON="Torre Eiffel|Coliseo|Taj Mahal|Machu Picchu|Cristo Redentor|Estatua de la Libertad|Gran Muralla China|Gran Pirámide de Guiza|Chichén Itzá|Sagrada Familia|Big Ben|Partenón|Petra|Alhambra|Puente Golden Gate|Ópera de Sídney|Torre de Pisa|Angkor Wat|Stonehenge|Moái|Burj Khalifa|Acrópolis de Atenas|Santa Sofía|Catedral de Notre-Dame de París|Puerta de Brandeburgo|Castillo de Neuschwanstein|Monte Rushmore|Basílica de San Pedro|Arco del Triunfo|Torre de Londres|Puente de la Torre|Palacio de Buckingham|Catedral de San Basilio|Ciudad Prohibida|Monte Fuji|Cataratas del Niágara|Cataratas del Iguazú|Gran Cañón|Uluru|Torre CN|Empire State Building|Edificio Chrysler|Puente de Brooklyn|Space Needle|Teotihuacán|Palenque|Tikal|Giralda|Mezquita-Catedral de Córdoba|Acueducto de Segovia|Palacio Real de Madrid|Puerta de Alcalá|Parque Güell|Casa Batlló|Torre del Oro|Fontana de Trevi|Panteón de Agripa|Catedral de Milán|Puente de Rialto|Plaza de San Marcos|Palacio Ducal de Venecia|Foro Romano|Pompeya|Delfos|Templo de Karnak|Abu Simbel|Esfinge de Guiza|Valle de los Reyes|Mezquita del Sultán Ahmed|Borobudur|Fuerte Rojo|Kremlin de Moscú|Cristo de Corcovado|Torre Latinoamericana|Castillo de Chapultepec|Sacsayhuamán|Isla de Pascua|Tour Montparnasse|Palacio de Versalles|Louvre|Torre Willis|Atomium";
const FOO="Pizza|Sushi|Paella|Taco|Hamburguesa|Lasaña|Ceviche|Empanada|Tamal|Arepa|Gazpacho|Tortilla de patatas|Cruasán|Baguette|Crepé|Fondue|Risotto|Tiramisú|Helado|Chocolate|Fresa=Fragaria × ananassa|Manzana=Malus domestica|Naranja=Citrus × sinensis|Uva=Vitis vinifera|Mango=Mangifera indica|Piña=Ananas comosus|Sandía=Citrullus lanatus|Aguacate=Persea americana|Coco=Cocos nucifera|Limón=Citrus × limon|Cereza=Prunus avium|Durazno=Prunus persica|Pera=Pyrus communis|Kiwi=Actinidia deliciosa|Papaya=Carica papaya|Tomate=Solanum lycopersicum|Maíz=Zea mays|Papa=Solanum tuberosum|Zanahoria=Daucus carota|Cebolla=Allium cepa|Ajo=Allium sativum|Café|Té|Queso|Pan|Miel|Sopa|Ensalada|Tarta|Galleta|Gofre|Panqueque|Churro|Flan|Brownie|Magdalena|Palomitas de maíz|Nachos|Guacamole|Ramen|Pad thai|Curry|Kebab|Falafel|Hummus|Pollo frito|Bistec|Jamón|Chorizo|Salchicha|Salmón=Salmo salar|Langosta|Camarón|Caviar|Ostra|Pasta|Arroz con leche|Ñoquis|Pretzel|Bagel|Dim sum|Gyōza|Brócoli=Brassica oleracea var. italica|Plátano frito=Tostones|Arroz";
const ACT="Leonardo DiCaprio|Brad Pitt|Tom Hanks|Will Smith|Johnny Depp|Robert Downey Jr.|Keanu Reeves|Morgan Freeman|Denzel Washington|Tom Cruise|Jennifer Lawrence|Scarlett Johansson|Angelina Jolie|Meryl Streep|Julia Roberts|Nicole Kidman|Cate Blanchett|Natalie Portman|Emma Stone|Anne Hathaway|Sandra Bullock|Charlize Theron|Margot Robbie|Gal Gadot|Penélope Cruz|Salma Hayek|Antonio Banderas|Javier Bardem|Gael García Bernal|Diego Luna|Eugenio Derbez|Cantinflas|Pedro Infante|Jorge Negrete|Sofía Vergara|Jennifer Aniston|Matt Damon|Ben Affleck|George Clooney|Harrison Ford|Al Pacino|Robert De Niro|Jack Nicholson|Anthony Hopkins|Clint Eastwood|Arnold Schwarzenegger|Sylvester Stallone|Jackie Chan|Bruce Lee|Jim Carrey|Eddie Murphy|Robin Williams|Charles Chaplin|Marilyn Monroe|Audrey Hepburn|Marlon Brando|Humphrey Bogart|Sean Connery|Daniel Craig|Hugh Jackman|Chris Hemsworth|Chris Evans|Ryan Reynolds|Dwayne Johnson|Vin Diesel|Jason Statham|Bruce Willis|Mel Gibson|Kevin Costner|Russell Crowe|Christian Bale|Joaquin Phoenix|Gary Oldman|Ian McKellen|Patrick Stewart|Emma Watson|Daniel Radcliffe|Kate Winslet|Helen Mirren|Judi Dench|Edward Norton|Jodie Foster|Halle Berry";
const C=[[MON,7,"🏛️",210],[FOO,11,"🍽️",20],[ACT,13,"🎬",290]].map(a=>({l:a[0].split("|"),m:a[1],e:a[2],h:a[3]}));
function items(p){const a=[];C.forEach((c,ci)=>{for(let j=0;j<2;j++){const s=c.l[((p*2+j)*c.m)%c.l.length].split("=");a.push({n:s[0],t:s[1]||s[0],c:ci})}});const o=[];for(let k=0;k<6;k++)o.push(a[(k*5+p)%6]);return o}
const LOGO='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><radialGradient id="b" cx="50%" cy="35%" r="75%"><stop offset="0" stop-color="#6a2fb8"/><stop offset="1" stop-color="#12062a"/></radialGradient><radialGradient id="i"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#7df9ff"/><stop offset="1" stop-color="#7b3fe4"/></radialGradient></defs><rect width="100" height="100" rx="22" fill="url(#b)"/><g stroke="#ffd36b" stroke-width="2" stroke-linecap="round"><path d="M50 8v9M26 15l4 7M74 15l-4 7M12 28l7 4M88 28l-7 4M50 92v-9M26 85l4-7M74 85l-4-7"/></g><path d="M9 50Q50 12 91 50Q50 88 9 50Z" fill="#0d0620" stroke="#ffd36b" stroke-width="3.5"/><circle cx="50" cy="50" r="17" fill="url(#i)"/><circle cx="50" cy="50" r="6.5" fill="#0d0620"/><circle cx="45" cy="45" r="3" fill="#fff"/><path d="M80 20l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="#ffd36b"/></svg>';
const LU="data:image/svg+xml,"+encodeURIComponent(LOGO);$("lg").src=LU;
(function(){const a=document.createElement("link");a.rel="icon";a.href=LU;document.head.appendChild(a);const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=180;c.getContext("2d").drawImage(im,0,0,180,180);const l=document.createElement("link");l.rel="apple-touch-icon";l.href=c.toDataURL("image/png");document.head.appendChild(l)};im.src="data:image/svg+xml,"+encodeURIComponent(LOGO.replace('rx="22"','rx="0"'))})();
const ls=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const st={p:0,last:null,sx:0,sy:0,voz:ls("md_voz","1")==="1",lang:ls("md_lang","es-ES")};
const cache={};
function trim(t){t=t||"";if(t.length>900){t=t.slice(0,900);const k=t.lastIndexOf(". ");if(k>300)t=t.slice(0,k+1)}return t}
async function fetchSum(it){try{const r=await fetch("https://es.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(it.t.replace(/ /g,"_")));if(!r.ok)return null;const d=await r.json();return d.type==="disambiguation"?null:d}catch(e){return null}}
async function load(it){const s=await dbGet(it.t);if(s)return{text:s.text,img:s.blob?URL.createObjectURL(s.blob):null};
const d=await fetchSum(it);if(!d)return null;const u=d.thumbnail?d.thumbnail.source:null;return{text:trim(d.extract),img:u?u.replace(/\/\d+px-/,"/600px-"):null,img0:u}}
function info(it){const k=it.t;if(!cache[k])cache[k]=load(it).then(d=>{if(!d)delete cache[k];return d});return cache[k]}
function art(it){const c=C[it.c];return "data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="hsl('+c.h+',70%,45%)"/><text x="50" y="66" font-size="48" text-anchor="middle">'+c.e+'</text></svg>')}
function render(){$("pg").textContent=(st.p+1)+"/"+N;const gr=$("grid");gr.innerHTML="";const p=st.p;
items(p).forEach((it,i)=>{const c=document.createElement("div");c.className="c";c.dataset.i=i;c.innerHTML='<img alt=""><span></span>';const im=c.firstChild;im.src=art(it);c.lastChild.textContent=it.n;gr.appendChild(c);
info(it).then(d=>{if(d&&d.img&&st.p===p){im.onerror=()=>{im.onerror=null;im.src=d.img0||art(it)};im.src=d.img}})})}
function go(d){st.p=(st.p+d+N)%N;render()}
function toast(t){const o=$("toast");o.textContent=t;o.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>o.style.opacity=0,4000)}
function say(t,q){if(!st.voz||!window.speechSynthesis)return;try{if(!q)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=st.lang;speechSynthesis.speak(u)}catch(e){}}
function open(i){const it=items(st.p)[i];st.last={p:st.p,i:i,n:it.n};
$("grid").style.display="none";$("det").style.display="flex";$("dn").textContent=it.n;$("dt").textContent="Cargando…";$("di").src=art(it);$("det").scrollTop=0;
say("Página "+(st.p+1)+", imagen "+(i+1)+": "+it.n+".");
info(it).then(d=>{if(!st.last||st.last.n!==it.n)return;
if(!d){$("dt").textContent="No hay información guardada. Descárgala desde la configuración, con internet.";return}
if(d.img){const im=$("di");im.onerror=()=>{im.onerror=null;im.src=d.img0||art(it)};im.src=d.img}
$("dt").textContent=d.text})}
function back(){$("det").style.display="none";$("grid").style.display="grid"}
$("back").onclick=back;
const grid=$("grid");
grid.addEventListener("pointerdown",e=>{st.sx=e.clientX;st.sy=e.clientY});
grid.addEventListener("pointerup",e=>{const dx=e.clientX-st.sx,dy=e.clientY-st.sy;
if(Math.abs(dx)>60){go(dx<0?1:-1);return}
if(Math.abs(dx)<12&&Math.abs(dy)<12){const c=e.target.closest(".c");if(c)open(+c.dataset.i)}});
$("close").onclick=()=>{const l=st.last;back();const t=l?"Lo último que vio: página "+l.p+1+", imagen "+(l.i+1)+": "+l.n+".":"No ha abierto ninguna imagen.";
const tt=l?"Lo último que vio: página "+(l.p+1)+", imagen "+(l.i+1)+": "+l.n+".":t;toast(tt);say(tt)};
document.addEventListener("touchstart",e=>{if(e.touches.length>=3){e.preventDefault();$("set").style.display="block"}},{passive:false});
$("sc").onclick=()=>{$("set").style.display="none"};
$("vz").checked=st.voz;$("lang").value=st.lang;
$("vz").onchange=e=>{st.voz=e.target.checked;sv("md_voz",st.voz?"1":"0")};
$("lang").onchange=e=>{st.lang=e.target.value;sv("md_lang",st.lang)};
$("test").onclick=()=>say("Prueba de audio. Página 1, imagen 3: Fresa.");
let db=null;
const dbOpen=()=>new Promise(r=>{try{const q=indexedDB.open("descubre",1);q.onupgradeneeded=()=>q.result.createObjectStore("d");q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const dbGet=k=>new Promise(r=>{try{const q=db.transaction("d").objectStore("d").get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}});
const dbSet=(k,v)=>new Promise(r=>{try{const t=db.transaction("d","readwrite");t.objectStore("d").put(v,k);t.oncomplete=()=>r(true);t.onerror=()=>r(false)}catch(e){r(false)}});
let busy=false;
$("dl").onclick=async()=>{if(busy)return;busy=true;$("dl").disabled=true;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const all=[];C.forEach(c=>c.l.forEach(x=>{const a=x.split("=");all.push({n:a[0],t:a[1]||a[0]})}));
const q=all.slice(),total=all.length;let done=0,fail=0;const prog=()=>{$("dls").textContent="Descargando: "+(done+fail)+" de "+total+(fail?" ("+fail+" sin conexión o sin artículo)":"")};prog();
async function w(){while(q.length){const it=q.shift();if(await dbGet(it.t)){done++;prog();continue}
const d=await fetchSum(it);if(!d){fail++;prog();continue}
let blob=null;if(d.thumbnail){try{let r=await fetch(d.thumbnail.source.replace(/\/\d+px-/,"/600px-"));if(!r.ok)r=await fetch(d.thumbnail.source);if(r.ok)blob=await r.blob()}catch(e){}}
await dbSet(it.t,{text:trim(d.extract),blob});done++;prog()}}
await Promise.all([w(),w(),w(),w()]);busy=false;$("dl").disabled=false;
$("dls").textContent=fail?"Se guardaron "+done+" de "+total+". Con internet, pulsa de nuevo para completar los "+fail+" que faltan.":"Listo: "+done+" temas guardados. Ya funciona sin internet."};
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
dbOpen().then(render);
</script>
</body></html>
